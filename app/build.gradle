plugins { id 'com.android.application' }

def abi = providers.gradleProperty('runtimeAbi').getOrElse('arm64-v8a')
if (!(abi in ['arm64-v8a', 'x86_64'])) throw new GradleException("Unsupported ABI")
def runtime = rootProject.file("runtime-cache/${abi}")
def keyDir = rootProject.file('.signing')
def passFile = new File(keyDir, 'password')
android {
    namespace 'com.sunwin.deepseekharness'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sunwin.deepseekharness'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName '0.1.5'
        testInstrumentationRunner 'com.sunwin.deepseekharness.DeviceSmoke'
        ndk { abiFilters abi }
    }
    testBuildType 'release'
    testOptions.unitTests.includeAndroidResources = true
    sourceSets.main {
        jniLibs.srcDir new File(runtime, 'jni')
        assets.srcDir new File(runtime, 'assets')
    }
    sourceSets.androidTest.assets.srcDir 'src/test/resources'
    signingConfigs {
        release {
            storeFile new File(keyDir, 'release.p12')
            storePassword passFile.exists() ? passFile.text.trim() : ''
            keyAlias 'harness-test'
            keyPassword storePassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // The public source has its own history. Keep the private checkout revision out of the APK.
            vcsInfo.include = false
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
tasks.register('prepareRuntime', Exec) {
    workingDir rootDir
    commandLine 'python3', 'tools/runtime.py', abi
}
tasks.named('preBuild').configure { dependsOn 'prepareRuntime' }
dependencies {
    // Local PDF text and image extraction needs no signing or public-key encryption provider.
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') { exclude group: 'org.bouncycastle' }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.browser:browser:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.withType(Test).configureEach {
    def replayAbi = providers.environmentVariable('HARNESS_REPLAY').getOrElse('')
    inputs.property('replayAbi', replayAbi)
    if (replayAbi) {
        inputs.files(rootProject.file('tools/replay.py'), file('src/main/assets/chat.yml'),
                file('src/main/assets/phone-context.cjs'), rootProject.file('tools/runtime.lock.json'))
    }
}
