- insert:
    - id: preset-phone-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: phone-chat
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: &phonePersona 你是 DeepSeek 助手。请自然、简洁地回答用户的问题。
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: false
                  maxTokens: 2048
              - id: phone-context
                name: /etc/phone-context.cjs
                config:
                  persona: *phonePersona
